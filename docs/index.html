<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London + Iceland &middot; Oct 10&ndash;17, 2026</title>
<meta name="description" content="Offline-capable trip companion for London and Iceland, October 10-17 2026.">
<!-- A GitHub Pages site is publicly readable. This page says which week the
     house is empty, so keep it out of search results. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E7EAEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0D0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css" onerror="window.__cssFail=1">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="app">

  <!-- thin top strip: connection, date override, theme -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="dot dot--on" id="netdot" role="img" aria-label="Online"></span>
      <b>London + Iceland</b>
    </div>
    <button class="chip" id="dateChip" aria-expanded="false" aria-controls="datePanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span id="dateChipLabel">Date</span>
    </button>
    <button class="chip" id="themeBtn" title="Switch light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      <span class="sr-only">Switch light or dark theme</span>
    </button>
  </header>

  <div class="offline-banner" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5-2.6M1.4 9.3a15 15 0 0 1 4-2.6M22.6 9.3a15 15 0 0 0-9.5-3.2M19 12.9a10 10 0 0 0-2-1.3"/><circle cx="12" cy="20" r="1"/></svg>
    <span>No signal. Showing everything from this device&rsquo;s cache.</span>
  </div>

  <!-- date override panel (hidden until the chip is tapped) -->
  <div id="datePanel" hidden style="max-width:720px;margin:0 auto;padding:16px 12px 0;width:100%">
    <div class="card"><div class="card__body stack">
      <p class="eyebrow">Preview any day</p>
      <label class="field">
        <span class="field__l">Pretend today is</span>
        <input type="date" id="dateInput" min="2026-08-01" max="2026-12-31">
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn--sm" data-jump="2026-08-21">Now</button>
        <button class="btn btn--sm" data-jump="2026-09-10">4 wks out</button>
        <button class="btn btn--sm" data-jump="2026-10-06">Week of</button>
        <button class="btn btn--sm" data-jump="2026-10-14">Mid-trip</button>
        <button class="btn btn--sm" data-jump="2026-10-20">After</button>
      </div>
      <button class="btn btn--block" id="dateReset">Use the real date</button>
    </div></div>
  </div>

  <main class="main" id="main" tabindex="-1"></main>

  <!-- bottom tab bar: thumb reach, glove-safe targets -->
  <nav class="tabs" aria-label="Sections">
    <a class="tab" href="#/today" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M17 7l2.1-2.1M4.9 19.1L7 17"/></svg>
      Today
    </a>
    <a class="tab" href="#/days" data-view="days">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h3M8 18h6"/></svg>
      Days
    </a>
    <a class="tab" href="#/map" data-view="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M9 3.5 3 6v15l6-2.5 6 2.5 6-2.5V3.5L15 6 9 3.5Z"/><path d="M9 3.5V18.5M15 6v15"/></svg>
      Map
    </a>
    <a class="tab" href="#/aurora" data-view="aurora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 20c0-8 2-14 4-14s2 4 2 8M11 20c0-9 2-16 4-16s2 5 2 10M18 20c0-6 1-10 2-10"/></svg>
      Aurora
    </a>
    <a class="tab" href="#/prep" data-view="prep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 6h2l1 1M4 12h2l1 1M4 18h2l1 1M11 6h9M11 12h9M11 18h9"/><path d="M6 5.5 8 8l3-4" stroke-linecap="round"/></svg>
      Prep
    </a>
    <a class="tab" href="#/info" data-view="info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      Info
    </a>
  </nav>

</div>

<script src="data.js" onerror="window.__dataFail=1"></script>
<script src="app.js"></script>
</body>
</html>
